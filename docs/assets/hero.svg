<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">Strix Claude Bridge</title>
  <desc id="desc">An unofficial opt-in bridge from Claude Agent SDK through Strix tools to isolated Docker execution and security reports.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a2529" stroke-width="1"/>
    </pattern>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#4dd6dd"/>
      <stop offset="1" stop-color="#f7ba4a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="440" rx="24" fill="#090d0f"/>
  <rect width="1400" height="440" rx="24" fill="url(#grid)" opacity=".85"/>
  <path d="M0 354C230 291 376 397 625 330S1045 278 1400 345V440H0Z" fill="#0d171a"/>
  <path d="M0 354C230 291 376 397 625 330S1045 278 1400 345" fill="none" stroke="#22373d" stroke-width="2"/>

  <g transform="translate(74 60)">
    <rect x="0" y="0" width="184" height="34" rx="17" fill="#11272b" stroke="#285159"/>
    <circle cx="20" cy="17" r="5" fill="#6ad78e" filter="url(#glow)"/>
    <text x="35" y="22" fill="#b9c7cc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">LIVE E2E VERIFIED</text>

    <text x="0" y="125" fill="#f2f6f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="68" font-weight="800" letter-spacing="-4">STRIX</text>
    <text x="212" y="125" fill="#4dd6dd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="68" font-weight="300">×</text>
    <text x="273" y="125" fill="#f7ba4a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="68" font-weight="800" letter-spacing="-4">CLAUDE</text>
    <text x="0" y="169" fill="#96a6ac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.2">YOUR SUBSCRIPTION. STRIX'S TOOLCHAIN. ONE LOCAL BRIDGE.</text>
  </g>

  <g transform="translate(75 292)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M88 28H310M427 28H649M766 28H988" stroke="url(#edge)" stroke-width="3" stroke-dasharray="8 10"/>
    <g>
      <rect width="176" height="58" rx="10" fill="#102126" stroke="#35646d"/>
      <text x="88" y="24" text-anchor="middle" fill="#4dd6dd" font-size="12" letter-spacing="1.2">CLAUDE AGENT SDK</text>
      <text x="88" y="43" text-anchor="middle" fill="#82949a" font-size="11">official local login</text>
    </g>
    <g transform="translate(310)">
      <rect width="234" height="58" rx="10" fill="#151f22" stroke="#45545a"/>
      <text x="117" y="24" text-anchor="middle" fill="#e2e8eb" font-size="12" letter-spacing="1.2">STRIX AGENT GRAPH</text>
      <text x="117" y="43" text-anchor="middle" fill="#82949a" font-size="11">34 tools · root + children</text>
    </g>
    <g transform="translate(649)">
      <rect width="234" height="58" rx="10" fill="#201b12" stroke="#69572e"/>
      <text x="117" y="24" text-anchor="middle" fill="#f7ba4a" font-size="12" letter-spacing="1.2">DOCKER / CAIDO</text>
      <text x="117" y="43" text-anchor="middle" fill="#9f937a" font-size="11">isolated execution</text>
    </g>
    <g transform="translate(988)">
      <rect width="250" height="58" rx="10" fill="#122219" stroke="#315d40"/>
      <text x="125" y="24" text-anchor="middle" fill="#6ad78e" font-size="12" letter-spacing="1.2">REPORTS + SARIF</text>
      <text x="125" y="43" text-anchor="middle" fill="#839a89" font-size="11">owner-only artifacts</text>
    </g>
  </g>

  <text x="1325" y="411" text-anchor="end" fill="#526168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">UNOFFICIAL · LOCAL · OPT-IN</text>
</svg>
